name: ultimate_theme_creator_studio
description: Flutter studio for creating and exporting FUTO Keyboard themes.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.6.1
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.1.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_theme/
    - assets/shapes/
    - assets/backgrounds/
