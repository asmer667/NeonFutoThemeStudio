name: futo_theme_studio
description: A powerful Flutter app for creating FUTO Keyboard themes.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  archive: ^3.6.1
  image: ^4.3.0
  file_picker: 8.1.7
  uuid: ^4.5.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
